name: PD model image and container verification

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      PD_MODEL_DVC_ARCHIVE_URL: ${{ vars.PD_MODEL_DVC_ARCHIVE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Restore model and data
        run: python scripts/bootstrap_dvc_remote.py
      - name: Build and verify container
        run: |
          docker build -t pd-model:verify .
          docker run -d --name pd-model-verify -p 127.0.0.1:8000:8000 pd-model:verify
          trap 'docker stop pd-model-verify' EXIT
          python scripts/smoke_api.py --output reports/evidence/docker_smoke.json
          python -m pd_model.monitoring.simulate --scenario normal --rows 200
          python -m pd_model.monitoring.simulate --scenario shifted --rows 200
      - name: Publish image after successful checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/pd-model:$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag pd-model:verify "$image"
          docker push "$image"
      - name: Save deployment and drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-model-container-evidence
          path: |
            reports/evidence/docker_smoke.json
            reports/monitoring
